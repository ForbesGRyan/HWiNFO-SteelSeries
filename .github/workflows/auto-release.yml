name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/**'
      - 'src-tauri/Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version detection

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install GitHub CLI
        run: |
          winget install --id GitHub.cli --silent --accept-source-agreements
        continue-on-error: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          # Read version from src-tauri/Cargo.toml. Bumping the manifest version
          # is what publishes a new release; pushes that don't bump it skip.
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CARGO_VERSION" ]; then
            echo "Could not parse version from src-tauri/Cargo.toml"
            exit 1
          fi
          NEW_VERSION="v${CARGO_VERSION}"
          echo "Manifest version: $NEW_VERSION"

          PREVIOUS=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "Previous release: ${PREVIOUS:-<none>}"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Skip if version already released
        id: gate
        shell: bash
        run: |
          if gh release view ${{ steps.version.outputs.version }} &>/dev/null; then
            echo "Release ${{ steps.version.outputs.version }} already exists; nothing to do."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release binary
        if: steps.gate.outputs.skip != 'true'
        run: cargo build --release --verbose

      - name: Run tests
        if: steps.gate.outputs.skip != 'true'
        run: cargo test --release --verbose

      - name: Prepare release artifacts
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p release
          cp target/release/hwinfo-steelseries-oled.exe release/
          cp README.md release/
          if [ -f LICENSE ]; then cp LICENSE release/; fi

          # Create zip archive
          cd release
          7z a ../hwinfo-steelseries-oled-${{ steps.version.outputs.version }}-windows-x64.zip *

      - name: Generate release notes
        if: steps.gate.outputs.skip != 'true'
        id: notes
        shell: bash
        run: |
          PREV="${{ steps.version.outputs.previous }}"

          # Generate commit log since last release. If there is no previous
          # release (first run) fall back to the last 10 commits.
          if [ -n "$PREV" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" ${PREV}..HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" HEAD~10..HEAD)
          fi

          # Create release notes
          cat << EOF > release_notes.md
          ## Changes

          $NOTES

          ## Installation

          1. Download \`hwinfo-steelseries-oled-${{ steps.version.outputs.version }}-windows-x64.zip\`
          2. Extract the archive
          3. Run \`hwinfo-steelseries-oled.exe\`

          ## Requirements

          - Windows 10/11 (64-bit)
          - HWiNFO with Shared Memory Support enabled
          - SteelSeries GG
          - Compatible SteelSeries device with OLED screen

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${{ steps.version.outputs.version }}
          EOF

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            hwinfo-steelseries-oled-${{ steps.version.outputs.version }}-windows-x64.zip
            release/hwinfo-steelseries-oled.exe
            release/README.md
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release summary
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          echo "### Release ${{ steps.version.outputs.version }} Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Previous version:** ${{ steps.version.outputs.previous }}" >> $GITHUB_STEP_SUMMARY
          echo "**New version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
