[package]
name = "hwinfo-steelseries-oled"
version = "0.1.6"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
chrono = "0.4"
console = "0.16"
dialoguer = "0.12"
gamesense = "0.1.2"
rust-ini = "0.21"
serde_json = "1.0"
strum = { version = "0.27", features = ["derive"] }
tray-icon = "0.21"
winapi = {version="0.3", features=["memoryapi", "winnt", "wincon", "winuser"]}
